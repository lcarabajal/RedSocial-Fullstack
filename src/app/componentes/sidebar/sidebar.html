  <div class="brand">
    <h2>EA</h2>
  </div>

  <div class="nav-links">

    <a routerLink="/publicaciones" routerLinkActive="active-link" class="nav-item">
      <!-- Icono de casa básico -->
      <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">

     @if(perfilUsuario === 'admin'){

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>

          <line x1="19" y1="8" x2="19" y2="14"></line>
          <line x1="22" y1="11" x2="16" y2="11"></line>
        </svg>
       </a>

       <a routerLink="/estadisticas" routerLinkActive="active-link" class="nav-item" data-tooltip="Estadísticas">
          
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <line x1="6" y1="20" x2="6" y2="14"></line>

     }

      @if (imagenPerfil) {
        <img [src]="imagenPerfil" alt="Perfil" class="nav-avatar">

        <div class="nav-avatar-placeholder"></div>

 <!-- Botón Cerrar Sesión -->
    <a class="nav-item" (click)="cerrarSesion()" title="Cerrar sesión" style="color: #fca5a5;">

        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
